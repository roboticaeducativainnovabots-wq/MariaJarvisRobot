name: Build Maria APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Spanish Vosk model
        run: |
          rm -rf app/src/main/assets/model-es
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 --retry-delay 2 \
            -o /tmp/vosk-es.zip \
            https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          rm -rf /tmp/vosk-es
          mkdir -p /tmp/vosk-es
          unzip -q /tmp/vosk-es.zip -d /tmp/vosk-es
          mv /tmp/vosk-es/vosk-model-small-es-0.42 app/src/main/assets/model-es
          printf 'maria-vosk-es-0.42-v1\n' > app/src/main/assets/model-es/uuid

      - name: Install Android 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maria-Robot-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
